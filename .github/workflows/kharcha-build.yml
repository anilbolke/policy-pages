name: Kharcha Khata build

on:
  push:
    branches: [ kharcha-khata-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Build (unsigned release bundle + debug APK)
        run: |
          set -o pipefail
          mkdir -p out
          {
            npm ci
            npm run copy-libs
            npx cap add android
            npx cap sync android
            npm run patch-android
            npm run icons
            cd android
            ./gradlew bundleRelease assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee out/build-log.txt

      - name: Collect outputs
        if: always()
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab out/kharcha-khata-unsigned.aab || true
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kharcha-khata-debug.apk || true
          echo "run ${{ github.run_id }} commit ${{ github.sha }} status ${{ job.status }}" > out/STATUS.txt
          tail -c 200000 out/build-log.txt > out/build-log-tail.txt || true
          rm -f out/build-log.txt
          ls -la out

      - name: Publish outputs to kharcha-khata-output branch
        if: always()
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b kharcha-khata-output
          git add -A
          git commit -qm "Build outputs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kharcha-khata-output
