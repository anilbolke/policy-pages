<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha Khata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d1745">
<link rel="icon" href="img/rana-logo-192.png">
<style>
/* Layout: phone app shell — sticky header, scrolling ledger, bottom tab bar, floating add button. Brand: RANA.AI Technology */
@font-face{font-family:"Space Grotesk";font-weight:500;font-display:swap;src:url(lib/fonts/space-grotesk-500.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:700;font-display:swap;src:url(lib/fonts/space-grotesk-700.woff2) format("woff2")}
:root{
  --paper:#f7f7fc; --card:#ffffff; --ink:#141832; --muted:#5b6385; --line:#e2e0f0;
  --accent:#6d4aff; --accent-soft:#efeaff; --on-accent:#ffffff;
  --brand-g:linear-gradient(135deg,#7c5cff,#22d3ee);
  --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gold:#d98f0b; --gold-soft:#fbefd6;
  --bar:#1d1745; --on-bar:#ffffff; --bar-muted:rgba(255,255,255,.62); --bar-hi:#67e8f9;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --trip:#127566; --trip-soft:#dcf1ec;
  --ok:#1d8656; --warn:#c27400; --bad:#c2372d; --bad-soft:#fbe5e3;
  --shadow:0 1px 2px rgba(28,26,56,.06),0 6px 18px rgba(28,26,56,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f0d22; --card:#1a1733; --ink:#ecebf8; --muted:#a3a6c4; --line:#2c2950;
  --accent:#a08bff; --accent-soft:#2a2257; --on-accent:#120d33;
  --gold:#f0b23c; --gold-soft:#3a2c10; --trip:#4cc8b2; --trip-soft:#123a34;
  --bar:#151131; --bar-hi:#67e8f9;
  --ok:#4cc48a; --warn:#f0a63c; --bad:#f07a70; --bad-soft:#3d1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f0d22; --card:#1a1733; --ink:#ecebf8; --muted:#a3a6c4; --line:#2c2950;
  --accent:#a08bff; --accent-soft:#2a2257; --on-accent:#120d33;
  --gold:#f0b23c; --gold-soft:#3a2c10; --trip:#4cc8b2; --trip-soft:#123a34;
  --bar:#151131; --bar-hi:#67e8f9;
  --ok:#4cc48a; --warn:#f0a63c; --bad:#f07a70; --bad-soft:#3d1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--bar)}

/* header */
.top{position:sticky;top:var(--sat);z-index:20;background:var(--bar);color:var(--on-bar);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px}
.top-row{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.top h1{font-family:var(--display);font-size:clamp(17px,4.8vw,19px);line-height:1.25;margin:0;font-weight:700;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;opacity:.8;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:inherit}
.icon-btn:active{background:rgba(255,255,255,.15)}
.icon-btn svg{width:22px;height:22px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(110px + var(--sab))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-size:clamp(26px,8vw,34px);font-weight:750;letter-spacing:-.5px;line-height:1.1}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
@media (max-width:440px){.sheet .grid2.fstack{grid-template-columns:1fr}}
.inp[type=date]{min-height:44px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 2px -6px;font-weight:650}

/* ledger hero: the "khata" strip */
.hero{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hero-main{padding:16px;display:flex;flex-direction:column;gap:6px}
.hero-split{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px dashed var(--line)}
.hero-split>div{padding:12px clamp(10px,3.5vw,16px);display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-split>div+div{border-left:1px dashed var(--line)}
.hero-split .v{font-family:var(--display);font-weight:700;font-size:clamp(13px,4vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-split .label{font-size:10.5px;white-space:nowrap}

/* budget bar */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.home{background:var(--gold-soft);color:var(--gold)} .pill.trip{background:var(--trip-soft);color:var(--trip)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--gold-soft);color:var(--warn)}

/* book tiles */
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border:0;text-align:left;width:100%}
.tile .k{display:flex;align-items:center;gap:8px;font-weight:650}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.dot.home{background:var(--gold)} .dot.trip{background:var(--trip)}

/* ledger list */
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.day-h{display:flex;justify-content:space-between;padding:9px 16px;font-size:12.5px;font-weight:650;color:var(--muted);background:color-mix(in srgb,var(--paper) 55%,var(--card));border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:11px 16px;border:0;background:transparent;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--accent-soft)}
.cat-badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;color:#fff}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;text-align:right;white-space:nowrap}
.clip{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-left:4px}
.settle-row .cat-badge{background:var(--ok)!important}

/* chips & segments */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;white-space:nowrap;font-weight:550}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav b{font-size:15px}
.nav-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.nav-btn svg{width:18px;height:18px}

/* buttons & forms */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12.5px;color:var(--muted);font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:11px 12px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent)}
.amount-inp{font-family:var(--display);font-size:34px;font-weight:700;border:0;border-bottom:2px solid var(--accent);border-radius:0;background:transparent;padding:4px 0 6px 30px;width:100%}
.amount-wrap{position:relative}
.amount-wrap::before{content:"₹";position:absolute;left:0;top:7px;font-size:28px;font-weight:700;color:var(--muted)}
.member-line{display:flex;align-items:center;gap:10px;padding:8px 0}
.member-line+.member-line{border-top:1px solid var(--line)}
.member-line input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.member-line .inp{width:110px;text-align:right;padding:8px 10px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:var(--sab)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--bar-muted);min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--bar-hi)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + var(--sab));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--brand-g);color:#fff;box-shadow:0 8px 22px -6px rgba(109,74,255,.6);display:grid;place-items:center}
.fab svg{width:28px;height:28px}

.mic-fab{position:fixed;z-index:21;right:max(23px,calc(env(safe-area-inset-right,0px) + 23px));bottom:calc(146px + var(--sab));
  width:48px;height:48px;border-radius:15px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(0,0,0,.2);display:grid;place-items:center}
.mic-fab svg{width:22px;height:22px}
.mic-big{width:92px;height:92px;border-radius:50%;border:0;background:var(--brand-g);color:#fff;display:grid;place-items:center;margin:0 auto;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.mic-big svg{width:38px;height:38px}
.mic-big.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid #22d3ee;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic-big.live::after{animation:none}}
.hint{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hint button{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.vitem{display:flex;align-items:center;gap:10px;padding:10px 0}
.vitem+.vitem{border-top:1px solid var(--line)}
.vitem .act{border:0;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:6px 10px;font-weight:650;font-size:13px}
.vitem .rm{border:0;background:transparent;color:var(--muted);width:32px;height:32px;display:grid;place-items:center}
.vitem .rm svg{width:16px;height:16px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,8,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:calc(100% - var(--sat) - 20px);overflow:auto;border-radius:20px 20px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(20px + var(--sab));
  display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:19px;font-family:var(--display);font-weight:700}

.sheet>*{flex-shrink:0}
.amount-inp:focus,.amount-inp:focus-visible{outline:none;border-bottom-color:var(--gold)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.photo-prev{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:calc(12px + var(--sat));right:max(12px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.2);color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(212px + var(--sab));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:70;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:180px;font-size:13.5px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* setup + modules */
.setup{min-height:100%;display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.mode{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode .mi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--brand-g);color:var(--on-accent);font-weight:800;font-size:18px}
.mode b{display:block;font-size:16px;margin-bottom:2px}
.mode .d{font-size:13px;color:var(--muted)}
.sw-row{display:flex;align-items:center;gap:12px;padding:11px 0}
.sw-row+.sw-row{border-top:1px solid var(--line)}
.sw-row .t{font-weight:650}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:var(--accent)} .sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.money3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money3>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.money3 .v{font-family:var(--display);font-weight:700;font-size:clamp(14px,4.3vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-bg{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.person{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:transparent;width:100%;text-align:left}
.person+.person{border-top:1px solid var(--line)}
.person:active{background:var(--accent-soft)}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.gave{background:var(--bad-soft);color:var(--bad)} .btn.got{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok)}

/* bills / recurring */
.due{display:flex;align-items:center;gap:10px;padding:10px 0}
.due+.due{border-top:1px solid var(--line)}
.due .btns{display:flex;gap:6px;flex:none}
.due .btns button{border:0;border-radius:9px;padding:7px 10px;font-weight:650;font-size:13px}
.b-paid{background:var(--accent);color:var(--on-accent)} .b-skip{background:var(--line);color:var(--ink)}
.chipx{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.chipx.late{background:var(--bad-soft);color:var(--bad)} .chipx.soon{background:var(--gold-soft);color:var(--warn)}
/* lock */
.lock{position:fixed;inset:0;z-index:90;background:var(--bar);color:var(--on-bar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(24px + var(--sat)) max(16px,env(safe-area-inset-right,0px)) calc(24px + var(--sab)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lock .logo{width:76px;height:76px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 30px -8px rgba(34,211,238,.5)}
.lock .logo img{width:60px;height:60px}
.lock .by{position:absolute;bottom:calc(14px + var(--sab));left:0;right:0;text-align:center;font-size:12px;opacity:.6;letter-spacing:.04em}
.lock h2{margin:0;font-size:22px;font-family:var(--display)}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;opacity:.9}
.dots i.f{background:currentColor}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:inherit;font-size:26px;font-weight:600;display:grid;place-items:center}
.pad button:active{background:rgba(255,255,255,.25)}
.pad button.ghost{background:transparent;font-size:14px}
.pad button svg{width:26px;height:26px}
.sheet .pad button{background:var(--accent-soft);color:var(--accent)}
.sheet .dots{color:var(--accent)}
.linkbtn{border:0;background:transparent;color:inherit;opacity:.8;text-decoration:underline;font-size:14px;padding:8px}

/* brand */
.brandmark{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.brandmark img{width:28px;height:28px;display:block}
.brand-strip{height:3px;background:var(--brand-g)}
.about{display:flex;flex-direction:column;gap:12px}
.about .hd{display:flex;gap:12px;align-items:center}
.about .hd img{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:4px}
.about .nm{font-family:var(--display);font-weight:700;font-size:17px}
.grad-text{background:var(--brand-g);-webkit-background-clip:text;background-clip:text;color:transparent}
.made{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12.5px;padding:6px 0 0;border:0;background:transparent;width:100%}
.made img{width:18px;height:18px}
.contact-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.contact-row span:last-child{text-align:right;user-select:all;min-width:0;overflow-wrap:anywhere}
.setup-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0 4px}
.setup-hero .lg{width:84px;height:84px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 30px -10px rgba(109,74,255,.45)}
.setup-hero .lg img{width:68px;height:68px}
.setup-hero b{font-family:var(--display);font-size:26px}

/* reports */
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.hbar .bar{grid-column:1/-1;height:7px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .gridl{stroke:var(--line)}
.chart .b{fill:var(--accent)} .chart .b.peak{fill:var(--gold)}
table.bal{width:100%;border-collapse:collapse;font-size:14px}
table.bal td,table.bal th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
table.bal th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
table.bal td:first-child,table.bal th:first-child{text-align:left}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.transfer{display:flex;align-items:center;gap:10px;padding:10px 0}
.transfer+.transfer{border-top:1px solid var(--line)}
pre.csv{max-height:240px;overflow:auto;background:var(--paper);border-radius:10px;padding:10px;font:12px/1.4 var(--mono);white-space:pre}

  db:null, mem:{kv:{},photos:{}},
  open(){return new Promise(res=>{try{const rq=indexedDB.open('kharcha-khata',1);
    rq.onupgradeneeded=()=>{rq.result.createObjectStore('kv');rq.result.createObjectStore('photos')};
    rq.onsuccess=()=>{this.db=rq.result;res()};rq.onerror=()=>res();}catch(e){res()}})},
  get(store,key){return new Promise(res=>{if(!this.db)return res(this.mem[store][key]);try{const rq=this.db.transaction(store).objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(undefined)}catch(e){res(this.mem[store][key])}})},
  put(store,key,val){return new Promise(res=>{this.mem[store][key]=val;if(!this.db)return res();try{const tx=this.db.transaction(store,'readwrite');tx.objectStore(store).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})},
  del(store,key){return new Promise(res=>{delete this.mem[store][key];if(!this.db)return res();try{const tx=this.db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})},
  keys(store){return new Promise(res=>{if(!this.db)return res(Object.keys(this.mem[store]));try{const rq=this.db.transaction(store).objectStore(store).getAllKeys();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res([])}catch(e){res([])}})},
  clear(store){return new Promise(res=>{this.mem[store]={};if(!this.db)return res();try{const tx=this.db.transaction(store,'readwrite');tx.objectStore(store).clear();tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}

/* ============ domain ============ */
const book = id=>S.books.find(b=>b.id===id);
const trips = ()=>S.books.filter(b=>b.type==='trip');
const exOf = bookId=>S.expenses.filter(e=>e.bookId===bookId);
const realEx = list=>list.filter(e=>e.kind!=='settle');
const sum = list=>r2(list.reduce((a,e)=>a+(+e.amount||0),0));
const memberName = (b,id)=>{const m=b&&b.members.find(m=>m.id===id);return m?(m.id==='me'?(S.settings.name||'Me'):m.name):'—'};
const tripStatus = b=>{const t=today();if(b.end&&b.end<t)return 'done';if(b.start&&b.start>t)return 'upcoming';return 'active'};
function balances(b){
  const net={},paid={},share={};b.members.forEach(m=>{net[m.id]=0;paid[m.id]=0;share[m.id]=0});
  exOf(b.id).forEach(e=>{
    if(e.kind==='settle'){net[e.paidBy]=r2((net[e.paidBy]||0)+e.amount);net[e.to]=r2((net[e.to]||0)-e.amount);return}
    paid[e.paidBy]=r2((paid[e.paidBy]||0)+e.amount);net[e.paidBy]=r2((net[e.paidBy]||0)+e.amount);
    Object.entries(e.shares||{}).forEach(([m,v])=>{share[m]=r2((share[m]||0)+v);net[m]=r2((net[m]||0)-v)});
  });
  return {net,paid,share};
}
function settlements(net){
  const cr=[],dr=[];Object.entries(net).forEach(([m,v])=>{if(v>0.009)cr.push([m,v]);else if(v<-0.009)dr.push([m,-v])});
  cr.sort((a,b)=>b[1]-a[1]);dr.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<dr.length&&j<cr.length){const x=Math.min(dr[i][1],cr[j][1]);out.push({from:dr[i][0],to:cr[j][0],amount:r2(x)});dr[i][1]=r2(dr[i][1]-x);cr[j][1]=r2(cr[j][1]-x);if(dr[i][1]<0.01)i++;if(cr[j][1]<0.01)j++}
  return out;
}
function budgetState(spent,budget){if(!budget)return {pct:0,cls:'',none:true};const pct=spent/budget*100;return {pct,cls:pct>=100?'over':pct>=80?'warn':''}}
function budgetBar(spent,budget){if(!on('budgets'))return '';const s=budgetState(spent,budget);if(s.none)return '';return `<div class="bar ${s.cls}"><i style="width:${Math.min(100,s.pct).toFixed(1)}%"></i></div>`}
function budgetText(spent,budget){if(!on('budgets'))return '';if(!budget)return '<span class="muted small">No budget set</span>';const left=r2(budget-spent);
  return left>=0?`<span class="muted small num">${fmt(left)} left of ${fmt(budget)}</span>`:`<span class="small num" style="color:var(--bad);font-weight:650">${fmt(-left)} over ${fmt(budget)}</span>`}

/* ============ UI state ============ */
const ui = {tab:'overview',month:thisMonth(),catFilter:{},tripId:null,tripTab:'list',rep:{scope:'personal',period:'month'}};
let layerStack=[];

/* ============ render ============ */
function render(){
  if(ui.tab!=='setup'&&!S.settings.mode)ui.tab='setup';
  const allowed={home:on('home'),trips:on('trips'),trip:on('trips'),udhaar:on('udhaar'),income:on('income'),recurring:on('recurring')};
  if(allowed[ui.tab]===false)ui.tab='overview';
  let tabs=[['overview','Overview',I.grid],['daily','Daily',I.wallet]];
  if(on('home'))tabs.push(['home','Home',I.home]);
  if(on('trips'))tabs.push(['trips','Trips',I.trip]);
  if(on('udhaar')&&tabs.length<4)tabs.push(['udhaar','Udhaar',I.hand]);
  tabs.push(['reports','Reports',I.chart]);
  const activeTab = ui.tab==='trip'?'trips':ui.tab;
  const setup=ui.tab==='setup';
  document.querySelector('.tabs').hidden=setup;
  $('#tabs').innerHTML=tabs.map(([k,l,ic])=>`<button class="tab ${activeTab===k?'on':''}" data-tab="${k}" aria-label="${l}">${ic}<span>${l}</span></button>`).join('');
  $('#fab').hidden = setup||ui.tab==='reports'||ui.tab==='settings'||(ui.tab==='trip'&&ui.tripTab!=='list');
  $('#fab').setAttribute('aria-label',ui.tab==='udhaar'?'Add udhaar entry':ui.tab==='income'?'Add income':ui.tab==='recurring'?'Add bill or EMI':'Add expense');
  $('#micFab').hidden=$('#fab').hidden||!on('voice')||['udhaar','income','recurring'].includes(ui.tab);
  $('main').style.paddingBottom=setup?'calc(24px + var(--sab))':'';
  const v=({setup:vSetup,overview:vOverview,daily:()=>vBook('daily'),home:()=>vBook('home'),trips:vTrips,trip:vTrip,reports:vReports,settings:vSettings,income:vIncome,udhaar:vUdhaar,recurring:vRecurring})[ui.tab]();
  $('#top').innerHTML=v.top; $('#view').innerHTML=v.body;
}
const topBar=(title,sub,{back=false,gear=true,extra='',logo=false}={})=>`${back?`<button class="icon-btn" data-act="back" aria-label="Back">${I.back}</button>`:''}${logo?`<span class="brandmark"><img src="${BRAND.logo}" alt="${BRAND.company} logo"></span>`:''}<h1>${esc(title)}${sub?`<div class="sub">${esc(sub)}</div>`:''}</h1>${extra}${gear?`<button class="icon-btn" data-act="settings" aria-label="Settings">${I.gear}</button>`:''}`;

function itemRow(e,{showBook=false}={}){
  const b=book(e.bookId);if(!b)return '';
  if(e.kind==='settle'){
    return `<button class="item settle-row" data-act="edit" data-id="${e.id}"><span class="cat-badge">₹</span><span class="grow"><div class="t">${esc(memberName(b,e.paidBy))} paid ${esc(memberName(b,e.to))}</div><div class="s">Settlement${showBook?' · '+esc(b.name):''}</div></span><span class="amt num" style="color:var(--ok)">${fmt(e.amount)}</span></button>`;
  }
  const sub=[];
  if(showBook)sub.push(b.name);
  sub.push(e.cat);
  if(b.members.length>1){
    if(e.split==='individual')sub.push('for '+memberName(b,e.forMember));
    sub.push('paid by '+memberName(b,e.paidBy));
  }
  const myShare = b.type==='trip'&&e.shares&&e.shares.me!=null&&e.shares.me!==e.amount?`<div class="s num">your share ${fmt(e.shares.me)}</div>`:'';
  return `<button class="item" data-act="edit" data-id="${e.id}"><span class="cat-badge" style="background:${catColor(b.type,e.cat)}">${catInitials(e.cat)}</span>
    <span class="grow"><div class="t">${esc(e.note||e.cat)}${e.photoId?I.clip:''}</div><div class="s">${esc(sub.join(' · '))}</div></span>
    <span><div class="amt num">${fmt(e.amount)}</div>${myShare}</span></button>`;
}
function ledger(list,opts){
  if(!list.length)return '';
  const by={};list.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  return Object.keys(by).sort().reverse().map(d=>`<div class="day"><div class="day-h"><span>${dayLabel(d)}</span><span class="num">${fmt(sum(realEx(by[d])))}</span></div>${by[d].map(e=>itemRow(e,opts)).join('')}</div>`).join('');
}
const hasSamples=()=>S.expenses.some(e=>e.sample)||S.income.some(e=>e.sample)||S.udhaar.some(e=>e.sample)||S.recurring.some(r=>r.sample);
const sampleBanner=()=>hasSamples()?`<div class="banner"><p><b>You are looking at sample entries.</b> Explore the app, then clear them to start your own khata.</p><button class="btn ghost" data-act="clearSamples">Clear samples</button></div>`:'';

      <span class="small muted">${last?`Last month ${fmt(last)}`:'Your spending this month'}</span></div>
      <div class="hero-split"><div><span class="label">Today</span><span class="v num">${fmt(todayTot)}</span></div>${on('home')?`<div><span class="label">Daily</span><span class="v num">${fmt(dTot)}</span></div><div><span class="label">Home</span><span class="v num">${fmt(hTot)}</span></div>`:`<div><span class="label">Last 7 days</span><span class="v num">${fmt(weekTot)}</span></div><div><span class="label">Entries</span><span class="v num">${d.length}</span></div>`}</div></div>

function vBook(id){

  const all=exOf(id).filter(e=>monthOf(e.date)===m);
  const tot=sum(realEx(all));
  const f=ui.catFilter[id]||'';
  const list=f?all.filter(e=>e.cat===f):all;
  const used=[...new Set(all.map(e=>e.cat))];
  const dim=m===thisMonth()?new Date().getDate():daysInMonth(m);
  return {top:topBar(id==='daily'?'Daily Expenses':'Home Expenses',id==='daily'?'Personal, day-to-day':'Household & family'),body:`
    <div class="month-nav"><button class="nav-btn" data-act="month" data-d="-1" aria-label="Previous month">${I.back}</button><b>${esc(monthName(m))}</b><button class="nav-btn" data-act="month" data-d="1" aria-label="Next month" ${m>=thisMonth()?'disabled style="opacity:.35"':''}>${I.next}</button></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="row between"><span class="label">Spent this month</span>${on('budgets')?`<button class="pill ${id==='home'?'home':''}" data-act="budget" data-id="${id}" style="border:0">${I.edit.replace('<svg','<svg width="12" height="12"')} Budget</button>`:''}</div>
      <span class="big num">${fmt(tot)}</span>
      ${budgetBar(tot,b.budget)}${budgetText(tot,b.budget)}
      <span class="small muted num">Avg ${fmt(dim?Math.round(tot/dim):0)} / day · ${realEx(all).length} entries</span>
    </div>
    ${used.length>1?`<div class="chips"><button class="chip ${!f?'on':''}" data-act="cat" data-b="${id}" data-c="">All</button>${used.map(c=>`<button class="chip ${f===c?'on':''}" data-act="cat" data-b="${id}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
    ${list.length?ledger(list):`<div class="card empty"><b>Nothing for ${esc(monthName(m))}</b>Tap + to add a ${id==='daily'?'daily':'household'} expense.</div>`}
  `};
}

function tripTile(b){
  const tot=sum(realEx(exOf(b.id))),st=tripStatus(b),bal=balances(b);
  const my=bal.net.me||0;
  return `<button class="tile" data-act="openTrip" data-id="${b.id}">
    <span class="row between"><span class="k"><i class="dot trip"></i>${esc(b.name)}</span><span class="pill ${st==='done'?'':'trip'}">${st==='done'?'Completed':st==='upcoming'?'Upcoming':'Ongoing'}</span></span>
    <span class="small muted">${b.start?shortDate(b.start):''}${b.end?' – '+shortDate(b.end):''} · ${b.members.length} ${b.members.length===1?'person':'people'}</span>
    <span class="row between"><b class="num" style="font-size:20px">${fmt(tot)}</b>${b.members.length>1&&Math.abs(my)>0.009?`<span class="small num ${my>0?'pos':'neg'}" style="font-weight:650">${my>0?'You get '+fmt(my):'You owe '+fmt(-my)}</span>`:''}</span>
    ${budgetBar(tot,b.budget)}${b.budget?budgetText(tot,b.budget):''}

}

    ${act.length?`<h2 class="sec">Ongoing & upcoming</h2>${act.map(tripTile).join('')}`:''}

function vTrip(){

  const tab=ui.tripTab;
  let body='';
  if(tab==='list'){
    body= ex.length?ledger(ex):`<div class="card empty"><b>No expenses yet</b>Tap + to add tickets, hotel, food…</div>`;
  }else if(tab==='settle'){
    const tr=settlements(bal.net);
    body=`<div class="card"><table class="bal num"><thead><tr><th>Member</th><th>Paid</th><th>Share</th><th>Balance</th></tr></thead><tbody>
      ${b.members.map(m=>{const n=bal.net[m.id]||0;return `<tr><td>${esc(memberName(b,m.id))}</td><td>${fmt(bal.paid[m.id]||0)}</td><td>${fmt(bal.share[m.id]||0)}</td><td class="${n>0.009?'pos':n<-0.009?'neg':''}" style="font-weight:700">${n>0.009?'+':''}${fmt(n)}</td></tr>`}).join('')}
      </tbody></table><p class="small muted" style="margin:10px 0 0">Balance = paid − share (settlements included). Plus means the group owes them.</p></div>
      <h2 class="sec">Settle up</h2>
      <div class="card">${tr.length?tr.map(t=>`<div class="transfer"><span class="grow"><b>${esc(memberName(b,t.from))}</b> pays <b>${esc(memberName(b,t.to))}</b></span><b class="num">${fmt(t.amount)}</b><button class="btn ghost" style="padding:8px 12px" data-act="markPaid" data-from="${t.from}" data-to="${t.to}" data-amt="${t.amount}">Mark paid</button></div>`).join(''):`<div class="empty" style="padding:12px"><b>All settled</b>Nobody owes anything on this trip.</div>`}</div>`;
  }else{
    body=`<div class="card">${b.members.map(m=>{const used=ex.some(e=>e.paidBy===m.id||e.to===m.id||(e.shares&&e.shares[m.id]!=null));
      return `<div class="member-line"><span class="cat-badge" style="background:var(--trip);width:32px;height:32px">${catInitials(memberName(b,m.id))}</span><span class="grow">${esc(memberName(b,m.id))}${m.id==='me'?' <span class="muted small">(you)</span>':''}</span>
      <span class="small muted num">spent ${fmt(bal.share[m.id]||0)}</span>${m.id!=='me'&&!used?`<button class="icon-btn" style="color:var(--bad)" data-act="rmMember" data-m="${m.id}" aria-label="Remove">${I.x}</button>`:''}</div>`}).join('')}
      <div class="row" style="margin-top:10px"><input class="inp grow" id="newMember" placeholder="Add a member (e.g. Rohit)"><button class="btn" data-act="addMember">Add</button></div></div>
      <div class="row"><button class="btn line grow" data-act="editTrip">Edit trip</button><button class="btn danger grow" data-act="delTrip">Delete trip</button></div>`;
  }
  return {top:topBar(b.name,(b.start?shortDate(b.start):'')+(b.end?' – '+shortDate(b.end):''),{back:true}),body:`
    <div class="hero"><div class="hero-main"><span class="label">Trip total</span><span class="big num">${fmt(tot)}</span>${budgetBar(tot,b.budget)}${b.budget?budgetText(tot,b.budget):''}</div>
      <div class="hero-split"><div><span class="label">My share</span><span class="v num">${fmt(bal.share.me||0)}</span></div><div><span class="label">I paid</span><span class="v num">${fmt(bal.paid.me||0)}</span></div><div><span class="label">Per head</span><span class="v num">${fmt(b.members.length?Math.round(tot/b.members.length):0)}</span></div></div></div>
    <div class="seg"><button class="${tab==='list'?'on':''}" data-act="tripTab" data-t="list">Expenses</button><button class="${tab==='settle'?'on':''}" data-act="tripTab" data-t="settle">Settle up</button><button class="${tab==='members'?'on':''}" data-act="tripTab" data-t="members">Members</button></div>
    ${body}`};

/* ============ reports ============ */
function periodRange(p){
  const t=today(),m=thisMonth();
  if(p==='month')return [m+'-01',t];
  if(p==='last'){const lm=shiftMonth(m,-1);return [lm+'-01',lm+'-'+pad(daysInMonth(lm))]}
  if(p==='3m')return [shiftMonth(m,-2)+'-01',t];
  if(p==='year')return [t.slice(0,4)+'-01-01',t];
  return ['0000-01-01','9999-12-31'];
}
const periodName={month:'This month',last:'Last month','3m':'Last 3 months',year:'This year',all:'All time'};
function reportData(){
  const {scope,period}=ui.rep;
  const [from,to]=periodRange(period);
  let ids=scope==='personal'?(on('home')?['daily','home']:['daily']):[scope];
  let list=realEx(S.expenses.filter(e=>ids.includes(e.bookId)&&e.date>=from&&e.date<=to));
  const scopeName=scope==='personal'?(on('home')?'Daily + Home':'Daily'):(book(scope)||{}).name||'';
  return {list,from,to,ids,scopeName,periodLabel:periodName[period]};
}
function vReports(){
  const sc=ui.rep.scope;
  if(sc!=='personal'&&(!book(sc)||(book(sc).type==='trip'&&!on('trips'))||(sc==='home'&&!on('home'))||sc==='daily'&&!on('home')))ui.rep.scope='personal';
  const R=reportData(),list=R.list,tot=sum(list);
  const byCat={};list.forEach(e=>{const k=e.cat;byCat[k]=r2((byCat[k]||0)+e.amount)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const maxC=cats.length?cats[0][1]:1;
  const typeOf=id=>(book(id)||{}).type||'daily';
  // trend
  const monthly=['3m','year','all'].includes(ui.rep.period);
  const buckets={};list.forEach(e=>{const k=monthly?monthOf(e.date):e.date;buckets[k]=r2((buckets[k]||0)+e.amount)});
  let keys=[];
  if(!monthly){const s=new Date(R.from+'T00:00'),en=new Date((R.to<'9999'?R.to:today())+'T00:00');for(let d=new Date(s);d<=en;d.setDate(d.getDate()+1))keys.push(dstr(d))}
  else{keys=Object.keys(buckets).sort();if(keys.length){let k=keys[0];const out=[];while(k<=keys[keys.length-1]){out.push(k);k=shiftMonth(k,1)}keys=out}}
  const days=Math.max(1,(new Date(Math.min(new Date(R.to+'T00:00'),new Date(today()+'T00:00')))-new Date((list.length&&R.from==='0000-01-01'?list.map(e=>e.date).sort()[0]:R.from)+'T00:00'))/864e5+1);
  const tripScope=sc!=='personal'&&book(sc)&&book(sc).type==='trip';
  const memberPart=tripScope&&book(sc).members.length>1?(()=>{const b=book(sc),bal=balances(b);const mx=Math.max(1,...b.members.map(m=>bal.share[m.id]||0));
    return `<h2 class="sec">Spend per member</h2><div class="card" style="display:flex;flex-direction:column;gap:12px">${b.members.map(m=>`<div class="hbar"><span>${esc(memberName(b,m.id))}</span><b class="num">${fmt(bal.share[m.id]||0)}</b><div class="bar"><i style="width:${((bal.share[m.id]||0)/mx*100).toFixed(1)}%;background:var(--trip)"></i></div></div>`).join('')}</div>`})():'';
  return {top:topBar('Reports',R.scopeName+' · '+R.periodLabel),body:`
    <div class="chips"><button class="chip ${ui.rep.scope==='personal'?'on':''}" data-act="repScope" data-s="personal">${on('home')?'Daily + Home':'Daily'}</button>${on('home')?`<button class="chip ${sc==='daily'?'on':''}" data-act="repScope" data-s="daily">Daily</button><button class="chip ${sc==='home'?'on':''}" data-act="repScope" data-s="home">Home</button>`:''}${(on('trips')?trips():[]).map(t=>`<button class="chip ${sc===t.id?'on':''}" data-act="repScope" data-s="${t.id}">${esc(t.name)}</button>`).join('')}</div>
    <div class="chips">${Object.entries(periodName).map(([k,l])=>`<button class="chip ${ui.rep.period===k?'on':''}" data-act="repPeriod" data-p="${k}">${l}</button>`).join('')}</div>
    <div class="hero"><div class="hero-main"><span class="label">Total spent</span><span class="big num">${fmt(tot)}</span></div>
      <div class="hero-split"><div><span class="label">Entries</span><span class="v num">${list.length}</span></div><div><span class="label">Avg / day</span><span class="v num">${fmt(list.length?Math.round(tot/days):0)}</span></div><div><span class="label">Biggest</span><span class="v num">${fmt(list.length?Math.max(...list.map(e=>e.amount)):0)}</span></div></div></div>

    ${list.length?`
    <h2 class="sec">${monthly?'Month by month':'Day by day'}</h2>
    <div class="card chart">${trendSvg(keys,buckets,monthly)}</div>
    <h2 class="sec">By category</h2>

      return `<div class="hbar"><span>${esc(c)} <span class="muted small num">${(v/tot*100).toFixed(0)}%</span></span><b class="num">${fmt(v)}</b><div class="bar"><i style="width:${(v/maxC*100).toFixed(1)}%;background:${catColor(ty,c)}"></i></div></div>`}).join('')}</div>
    ${memberPart}`:`<div class="card empty"><b>No expenses in this period</b>Try another period or book.</div>`}
    <h2 class="sec">Export</h2>
    <div class="grid2"><button class="btn ghost" data-act="exportCsv">Excel (CSV)</button><button class="btn ghost" data-act="exportPdf">PDF report</button></div>

function trendSvg(keys,b,monthly){
  const W=340,H=150,pl=34,pb=20,pt=8,pr=4;const vals=keys.map(k=>b[k]||0);const mx=Math.max(1,...vals);
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(mx)));for(const m of [1,2,2.5,5,10])if(m*p>=mx)return m*p;return 10*p})();
  const n=Math.max(1,keys.length),bw=(W-pl-pr)/n;const y=v=>pt+(H-pt-pb)*(1-v/nice);
  const peak=vals.indexOf(Math.max(...vals));
  const tk=v=>v>=1e5?(v/1e5).toFixed(v%1e5?1:0)+'L':v>=1e3?(v/1e3).toFixed(v%1e3?1:0)+'k':String(v);
  let g='';[0,.5,1].forEach(f=>{const v=nice*f;g+=`<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${tk(v)}</text>`});
  const every=Math.ceil(n/7);
  const bars=vals.map((v,i)=>{const x=pl+i*bw+bw*.15,w=Math.max(1,bw*.7),yy=y(v);return `<rect class="b ${i===peak&&v>0?'peak':''}" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${(H-pb-yy).toFixed(1)}" rx="${Math.min(3,w/2)}"><title>${monthly?monthName(keys[i]):shortDate(keys[i])}: ${fmt(v)}</title></rect>`}).join('');
  const lbl=keys.map((k,i)=>i%every===0?`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${monthly?new Date(k+'-01T00:00').toLocaleDateString('en-IN',{month:'short'}):+k.slice(8)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending trend">${g}${bars}${lbl}</svg>`;
}

const pkey=n=>String(n||'').trim().toLowerCase();
function udhaarPeople(){
  const map={};
  S.udhaar.forEach(e=>{const k=pkey(e.person);if(!k)return;const p=map[k]||(map[k]={key:k,name:e.person.trim(),net:0,last:'',entries:[]});
    p.net=r2(p.net+(e.kind==='gave'?e.amount:-e.amount));p.entries.push(e);if(e.date>p.last)p.last=e.date});
  Object.values(map).forEach(p=>p.meta=S.people[p.key]||{});
  return Object.values(map).sort((a,b)=>(Math.abs(b.net)>0.009)-(Math.abs(a.net)>0.009)||b.last.localeCompare(a.last));
}
function udhaarTotals(){const ps=udhaarPeople();return {due:ps.filter(p=>Math.abs(p.net)>0.009&&p.meta.due&&p.meta.due<=today()).length,get:r2(ps.filter(p=>p.net>0).reduce((a,p)=>a+p.net,0)),give:r2(ps.filter(p=>p.net<0).reduce((a,p)=>a-p.net,0)),people:ps.length}}

const daysSince=d=>Math.round((new Date(today()+'T00:00')-new Date(d+'T00:00'))/864e5);

async function shareText(msg,phone){
  const wa=waNumber(phone);
  if(wa){const url=`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
    if(isNative()){location.href=url;return}
    const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return}
  if(isNative()){try{await plugin('Share').share({text:msg,dialogTitle:'Send via WhatsApp or SMS'});return}catch(e){if(/cancel/i.test(String(e&&e.message||e)))return}}
  try{await navigator.clipboard.writeText(msg);toast('Reminder copied. Paste it in WhatsApp');return}catch(e){}
  const sh=openLayer(`<h3>Reminder message</h3><p class="small muted" style="margin:0">Copy this and send it on WhatsApp or SMS.</p><pre class="csv" style="white-space:pre-wrap" id="rmTxt">${esc(msg)}</pre><button class="btn" data-x="ok">Done</button>`);
  const r=document.createRange();r.selectNodeContents(sh.querySelector('#rmTxt'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  sh.querySelector('[data-x=ok]').onclick=closeLayer;
}

      save();closeLayer();render();if(due)ensureNotifPermission().then(syncNotifs);else syncNotifs();
      const pp=udhaarPeople().find(p=>p.key===pkey(person));if(pp&&Math.abs(pp.net)<0.01&&S.people[pp.key])delete S.people[pp.key].due;
      toast(pp&&Math.abs(pp.net)<0.01?`All settled with ${person}`:pp&&pp.net>0?`${person} has to give you ${fmt(pp.net)}`:`You have to give ${person} ${fmt(-pp.net)}`,2800)}
  });
}

/* ============ recurring bills & EMIs ============ */
const STEP_NAME={1:'Monthly',3:'Every 3 months',6:'Every 6 months',12:'Yearly'};
function addMonths(d,n){const [y,m,dd]=d.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(dd,last));return dstr(t)}
function occurrences(r,until){const out=[];for(let k=0;k<600;k++){const d=addMonths(r.start,k*r.step);if(d>until)break;out.push(d)}return out}
function nextDue(r){let k=0;for(;k<600;k++){const d=addMonths(r.start,k*r.step);if(d>today()||(!r.done.includes(d)&&r.mode==='ask'))return d}return null}
function processRecurring(){
  let added=0;const t=today();
  S.recurring.filter(r=>r.active&&r.mode==='auto').forEach(r=>{
    occurrences(r,t).slice(-12).forEach(d=>{if(r.done.includes(d))return;
      const b=book(r.bookId)||book('daily');S.expenses.push({id:uid(),bookId:b.id,amount:r.amount,cat:r.cat,date:d,note:r.name,paidBy:'me',split:'equal',shares:{me:r.amount},recId:r.id,sample:r.sample||undefined});r.done.push(d);added++});
    r.done=r.done.slice(-24)});
  if(added){save();setTimeout(()=>toast(added===1?'1 recurring expense added':added+' recurring expenses added'),400)}
}
function pendingDues(){const t=today(),out=[];S.recurring.filter(r=>r.active&&r.mode==='ask').forEach(r=>occurrences(r,t).slice(-3).forEach(d=>{if(!r.done.includes(d))out.push({r,d})}));return out.sort((a,b)=>a.d.localeCompare(b.d))}
function upcomingDues(days){const t=today(),lim=addDays(t,days),out=[];S.recurring.filter(r=>r.active).forEach(r=>{for(let k=0;k<600;k++){const d=addMonths(r.start,k*r.step);if(d>lim)break;if(d>t){out.push({r,d});break}}});return out.sort((a,b)=>a.d.localeCompare(b.d))}
function markDue(id,d,paid){const r=S.recurring.find(x=>x.id===id);if(!r)return;
  if(paid){const b=book(r.bookId)||book('daily');S.expenses.push({id:uid(),bookId:b.id,amount:r.amount,cat:r.cat,date:today(),note:r.name,paidBy:'me',split:'equal',shares:{me:r.amount},recId:r.id})}
  r.done.push(d);r.done=r.done.slice(-24);save();render();syncNotifs();toast(paid?`${r.name} ${fmt(r.amount)} added to ${book(r.bookId).name}`:`${r.name} skipped for ${shortDate(d)}`)}
function dueRow(r,d,withBtns){const n=daysSince(d);
  const when=n>0?`<span class="chipx late">${n} ${n===1?'day':'days'} late</span>`:n===0?'<span class="chipx late">Due today</span>':`<span class="chipx ${n>=-3?'soon':''}">${n===-1?'Tomorrow':shortDate(d)}</span>`;
  return `<div class="due"><span class="cat-badge" style="background:${catColor((book(r.bookId)||{}).type||'daily',r.cat)}">${catInitials(r.name)}</span><span class="grow" style="min-width:0"><div style="font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div><div class="small muted"><b class="num" style="color:var(--ink)">${fmt(r.amount)}</b> ${when}${r.mode==='auto'?' · adds itself':''}</div></span>
    ${withBtns?`<span class="btns"><button class="b-skip" data-act="dueSkip" data-id="${r.id}" data-d="${d}">Skip</button><button class="b-paid" data-act="duePaid" data-id="${r.id}" data-d="${d}">Paid</button></span>`:''}</div>`}

/* ============ phone notifications ============ */
let notifAsked=false;
async function ensureNotifPermission(){
  if(!isNative())return false;const LN=plugin('LocalNotifications');if(!LN)return false;
  try{let p=await LN.checkPermissions();if(p.display!=='granted'&&!notifAsked){notifAsked=true;p=await LN.requestPermissions()}return p.display==='granted'}catch(e){return false}
}
function nid(str){let h=7;for(const c of str)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1}
async function syncNotifs(){
  if(!isNative())return;const LN=plugin('LocalNotifications');if(!LN)return;
  try{const p=await LN.checkPermissions();if(p.display!=='granted')return;
    const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const now=Date.now(),list=[];const at9=(d,off=0)=>{const x=new Date(d+'T09:00:00');x.setDate(x.getDate()+off);return x};
    if(on('recurring'))S.recurring.filter(r=>r.active).forEach(r=>{
      for(let k=0;k<600;k++){const d=addMonths(r.start,k*r.step);if(d<today()||r.done.includes(d))continue;
        if(r.mode==='ask'){const a=at9(d,-1);if(a.getTime()>now)list.push({id:nid(r.id+d+'b'),title:`${r.name} due tomorrow`,body:`${fmt(r.amount)} · tap to open Kharcha Khata`,schedule:{at:a,allowWhileIdle:true},isExactNotification:false});
          const b=at9(d);if(b.getTime()>now)list.push({id:nid(r.id+d),title:`${r.name} is due today`,body:`${fmt(r.amount)} · mark it Paid in the app`,schedule:{at:b,allowWhileIdle:true},isExactNotification:false})}
        else{const b=at9(d);if(b.getTime()>now)list.push({id:nid(r.id+d),title:`${r.name} added`,body:`${fmt(r.amount)} recorded in ${(book(r.bookId)||{}).name||'Daily'}`,schedule:{at:b,allowWhileIdle:true},isExactNotification:false})}
        break}});
    if(on('udhaar'))udhaarPeople().forEach(p=>{if(Math.abs(p.net)<0.01||!p.meta.due)return;const a=at9(p.meta.due);if(a.getTime()<=now)return;
      list.push({id:nid('u'+p.key+p.meta.due),title:p.net>0?`Collect ${fmt(p.net)} from ${p.name}`:`Return ${fmt(-p.net)} to ${p.name}`,body:'Udhaar reminder · Kharcha Khata',schedule:{at:a,allowWhileIdle:true},isExactNotification:false})});
    if(list.length)await LN.schedule({notifications:list.slice(0,60)});
  }catch(e){}
}

/* ============ privacy lock ============ */
async function hashPin(pin){const salt='kk:'+(S.settings.lockSalt||(S.settings.lockSalt=uid()));
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pin));return 's'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of salt+pin)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}}
function padHtml(withBio){return `<div class="dots" id="pDots"><i></i><i></i><i></i><i></i></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}" aria-label="${n}">${n}</button>`).join('')}
  ${withBio?`<button class="ghost" data-bio="1" aria-label="Use fingerprint">${I.finger}</button>`:'<span></span>'}<button data-n="0" aria-label="0">0</button><button class="ghost" data-del="1" aria-label="Delete">${I.del}</button></div>`}
function bindPad(root,onDone){let v='';const dots=()=>root.querySelectorAll('#pDots i').forEach((d,i)=>d.classList.toggle('f',i<v.length));
  root.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;
    if(t.dataset.n!=null&&v.length<4){v+=t.dataset.n;dots();if(v.length===4){const val=v;setTimeout(()=>{onDone(val,()=>{v='';dots();const d=root.querySelector('#pDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')})},120)}}
    if(t.dataset.del){v=v.slice(0,-1);dots()}});
  return {reset(){v='';dots()}}}
function setPinFlow(done){
  let first=null;
  const sh=openLayer(`<div class="row between"><h3 id="pinTitle">Set a 4-digit PIN</h3><button class="icon-btn" data-x="close" aria-label="Close">${I.x}</button></div><p class="small muted" id="pinSub" style="margin:-8px 0 0">Avoid easy ones like 1234 or your birth year.</p>${padHtml(false)}`);
  sh.querySelector('[data-x=close]').onclick=closeLayer;
  const pad=bindPad(sh,async(val,fail)=>{
    if(first===null){first=val;pad.reset();sh.querySelector('#pinTitle').textContent='Enter the PIN again';sh.querySelector('#pinSub').textContent='To make sure it is right.';return}
    if(val!==first){first=null;fail();sh.querySelector('#pinTitle').textContent='PINs did not match. Set again';return}
    const bio=S.settings.lock?S.settings.lock.bio:true;S.settings.lock={hash:await hashPin(val),bio};save();closeLayer();done&&done()});
}
async function bioAvailable(){if(!isNative())return false;try{const r=await plugin('NativeBiometric').isAvailable();return !!(r&&r.isAvailable)}catch(e){return false}}
async function tryBio(){try{await plugin('NativeBiometric').verifyIdentity({title:'Unlock Kharcha Khata',reason:'Unlock Kharcha Khata',negativeButtonText:'Use PIN'});unlock();return true}catch(e){return false}}
function unlock(){ui.locked=false;$('#lockLayer').innerHTML=''}
async function showLock(){
  if(!S.settings.lock||ui.locked)return;ui.locked=true;
  const bio=S.settings.lock.bio&&await bioAvailable();
  $('#lockLayer').innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-label="App locked"><div class="logo"><img src="${BRAND.logo}" alt=""></div><h2>Kharcha Khata</h2><p style="margin:-10px 0 0;opacity:.8" id="lockMsg">Enter your PIN</p>${padHtml(bio)}<button class="linkbtn" data-forgot="1">Forgot PIN?</button><div class="by">by ${BRAND.company.toUpperCase()}</div></div>`;
  const root=$('#lockLayer .lock');
  bindPad(root,async(val,fail)=>{if(await hashPin(val)===S.settings.lock.hash)unlock();else{fail();root.querySelector('#lockMsg').textContent='Wrong PIN. Try again'}});
  root.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;
    if(t.dataset.bio)tryBio();
    if(t.dataset.forgot){root.querySelector('#lockMsg').textContent=bio?'Use your fingerprint, or erase the app data to start again.':'The PIN cannot be recovered. You can erase all data on this phone and restore from a backup.';
      if(!root.querySelector('[data-erase]')){const b=document.createElement('button');b.className='linkbtn';b.dataset.erase='1';b.textContent='Erase all data on this phone';root.appendChild(b)}}
    if(t.dataset.erase){if(t.dataset.sure){DB.clear('photos');S=freshState();S.samplesShown=true;DB.put('kv','state',S);unlock();ui.tab='setup';render();toast('All data erased')}
      else{t.dataset.sure='1';t.textContent='Tap again to erase everything for good';t.style.color='var(--bar-hi)'}}});
  if(bio)setTimeout(tryBio,350);
}

/* ============ sheet / dialogs ============ */
function openLayer(html,onMount){
  const el=document.createElement('div');el.className='backdrop';el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  el.addEventListener('click',ev=>{if(ev.target===el)closeLayer()});
  $('#layer').appendChild(el);layerStack.push(el);if(onMount)onMount(el.querySelector('.sheet'));return el.querySelector('.sheet');
}
function closeLayer(){const el=layerStack.pop();if(el)el.remove()}
function confirmBox(title,msg,yes,onYes,danger=true){
  const sh=openLayer(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(msg)}</p><div class="grid2"><button class="btn line" data-x="no">Cancel</button><button class="btn ${danger?'danger':''}" data-x="yes">${esc(yes)}</button></div>`);
  sh.querySelector('[data-x=no]').onclick=closeLayer;sh.querySelector('[data-x=yes]').onclick=()=>{closeLayer();onYes()};
}
let toastT;
function toast(msg,ms=2200){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}

    q('#fCats').innerHTML=list.map(([c])=>`<button class="chip ${F.cat===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');

    else if(F.split==='individual'){inner=`<label class="field"><span>Whose expense is this?</span><select class="inp" id="fFor">${ms.map(m=>`<option value="${m.id}" ${F.forMember===m.id?'selected':''}>${esc(memberName(b,m.id))}</option>`).join('')}</select></label><p class="small muted" style="margin:0">Not shared. If someone else paid, this person owes them the full amount.</p>`}

    q('#fSplit').innerHTML=`<div class="field" style="gap:10px"><label class="field"><span>Paid by</span><select class="inp" id="fPaid">${ms.map(m=>`<option value="${m.id}" ${F.paidBy===m.id?'selected':''}>${esc(memberName(b,m.id))}</option>`).join('')}</select></label>
      <div class="field"><span>Split</span><div class="seg"><button data-sp="equal" class="${F.split==='equal'?'on':''}">Equally</button><button data-sp="individual" class="${F.split==='individual'?'on':''}">Individual</button><button data-sp="custom" class="${F.split==='custom'?'on':''}">Custom</button></div></div>

    if(t.id==='fAmt'&&book(F.bookId).members.length>1&&F.split!=='individual'){if(F.split==='equal')paintSplit();else{updRem(sh)}}
    if(t.id==='fOther')F.otherText=t.value;
    if(t.dataset.cm){F.shares[t.dataset.cm]=t.value===''?undefined:parseFloat(t.value)||0;updRem(sh)}});

function updRem(sh){const r=sh.querySelector('#fRem');if(!r)return;const amt=parseFloat(sh.querySelector('#fAmt').value)||0;const tot=r2(Object.values(F.shares||{}).reduce((a,v)=>a+(+v||0),0));const ok=Math.abs(tot-amt)<0.01;r.style.color=ok?'var(--ok)':'var(--warn)';r.textContent=ok?'Adds up to the total':`${fmt(amt-tot)} left to assign`}
async function saveExpense(sh){
  const err=m=>{const el=sh.querySelector('#fErr');el.textContent=m;el.hidden=false};
  const amt=r2(parseFloat(sh.querySelector('#fAmt').value));
  if(!(amt>0))return err('Enter an amount greater than zero.');
  const date=sh.querySelector('#fDate').value;if(!date)return err('Pick a date.');
  const b=book(F.bookId);let shares={},paidBy=F.paidBy||'me';
  if(b.members.length<2){shares={[paidBy]:amt};F.split='equal';F.among=[paidBy]}
  else if(F.split==='equal'){const ids=b.members.map(m=>m.id).filter(i=>(F.among||b.members.map(m=>m.id)).includes(i));if(!ids.length)return err('Select at least one person to split with.');
    shares=equalShares(amt,ids);F.among=ids}
  else if(F.split==='individual'){shares={[F.forMember]:amt}}
  else{Object.entries(F.shares||{}).forEach(([k,v])=>{if(v>0)shares[k]=r2(v)});const tot=r2(Object.values(shares).reduce((a,v)=>a+v,0));if(Math.abs(tot-amt)>=0.01)return err(`Custom shares add up to ${fmt(tot)}, but the amount is ${fmt(amt)}.`)}
  let photoId=F.photoId;
  if(F.removePhoto&&photoId){await DB.del('photos',photoId);photoId=null}
  if(F.newPhoto){if(photoId)await DB.del('photos',photoId);photoId=uid();await DB.put('photos',photoId,F.newPhoto)}
  // budget check before
  const prevSpent=b.type==='trip'?sum(realEx(exOf(b.id)).filter(x=>x.id!==F.id)):sum(realEx(exOf(b.id)).filter(x=>x.id!==F.id&&monthOf(x.date)===monthOf(date)));
  const typed=(F.otherText||'').trim().replace(/\s+/g,' ');
  const cat=F.cat==='Other'&&typed?typed.charAt(0).toUpperCase()+typed.slice(1):F.cat;
  const rec={id:F.id||uid(),bookId:F.bookId,amount:amt,cat,date,note:sh.querySelector('#fNote').value.trim(),paidBy,split:F.split,among:F.among,forMember:F.forMember,shares,photoId};
  const i=S.expenses.findIndex(x=>x.id===rec.id);if(i>=0)S.expenses[i]=rec;else S.expenses.push(rec);
  save();const cb=F.onSaved;closeLayer();if(cb)cb(rec);
  if(ui.tab==='daily'||ui.tab==='home'){if(F.bookId===ui.tab)ui.month=monthOf(date)}
  render();
  const after=prevSpent+amt;
  if(on('budgets')&&b.budget){if(after>=b.budget&&prevSpent<b.budget)return toast(`Budget crossed! ${b.name}: ${fmt(after)} of ${fmt(b.budget)}`,3500);
    if(after>=b.budget*.8&&prevSpent<b.budget*.8)return toast(`Heads up: 80% of ${b.name} budget used`,3200)}
  toast(i>=0?'Expense updated':'Expense saved');
}

/* ============ photos ============ */
let pendingPhoto=null;
$('#photoInput').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f||!pendingPhoto)return;
  try{const data=await compress(f);pendingPhoto(data)}catch(e){toast('Could not read that image')}});
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const MAX=1280;let w=img.width,h=img.height;if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.72))};img.src=fr.result};fr.readAsDataURL(file)})}

    <label class="field"><span>Trip name</span><input class="inp" id="tName" value="${esc(b?b.name:'')}" placeholder="e.g. Lonavala weekend" maxlength="40"></label>
    <div class="grid2"><label class="field"><span>Start</span><input class="inp" type="date" id="tStart" value="${b?b.start||'':today()}"></label><label class="field"><span>End</span><input class="inp" type="date" id="tEnd" value="${b?b.end||'':addDays(today(),2)}"></label></div>
    <label class="field"><span>Trip budget (₹, optional)</span><input class="inp num" id="tBudget" inputmode="decimal" value="${b&&b.budget?b.budget:''}" placeholder="20000"></label>
    ${isNew?`<label class="field"><span>Who's coming? (besides you, comma separated)</span><input class="inp" id="tMembers" placeholder="Rahul, Priya, Sameer"></label><p class="small muted" style="margin:-8px 0 0">Leave empty for a solo trip. You can add people later.</p>`:''}
    <div id="tErr" class="small" style="color:var(--bad);font-weight:600" hidden></div>
    <button class="btn block" data-x="save">${isNew?'Create trip':'Save'}</button>`);
  sh.querySelector('[data-x=close]').onclick=closeLayer;
  sh.querySelector('[data-x=save]').onclick=()=>{
    const name=sh.querySelector('#tName').value.trim();const st=sh.querySelector('#tStart').value,en=sh.querySelector('#tEnd').value;
    const er=m=>{const e=sh.querySelector('#tErr');e.textContent=m;e.hidden=false};

    const budget=r2(parseFloat(sh.querySelector('#tBudget').value)||0);
    if(isNew){const members=[{id:'me',name:'Me'}];(sh.querySelector('#tMembers').value||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(n=>members.push({id:uid(),name:n.slice(0,24)}));

    save();closeLayer();render();toast(isNew?'Trip created':'Trip updated');
  };
}

const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const plugin=n=>window.Capacitor&&(window.Capacitor.Plugins&&window.Capacitor.Plugins[n]||(window.Capacitor.registerPlugin&&window.Capacitor.registerPlugin(n)));
const b64=t=>{const by=new TextEncoder().encode(t);let s='';for(let i=0;i<by.length;i+=0x8000)s+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(s)};
async function deliverFile(name,mime,base64){
  if(isNative()){
    try{const FS=plugin('Filesystem'),SH=plugin('Share');
      const w=await FS.writeFile({path:name,data:base64,directory:'CACHE'});
      await SH.share({title:name,url:w.uri,dialogTitle:'Save or send '+name});return true}
    catch(e){if(String(e&&e.message||e).toLowerCase().includes('cancel'))return true;toast('Could not export: '+(e.message||e));return false}
  }
  try{const bin=atob(base64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}catch(e){}
  return false;
}
const fileStamp=()=>today().replace(/-/g,'');
function csvOf(R){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['Date','Book','Category','Note','Amount','Paid by','Split','My share']];
  [...R.list].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const b=book(e.bookId);rows.push([e.date,b.name,e.cat,e.note,e.amount,memberName(b,e.paidBy),b.members.length>1?e.split:'',e.shares&&e.shares.me!=null?e.shares.me:''])});
  rows.push([]);rows.push(['','','','Total',sum(R.list)]);rows.push([]);rows.push(['Generated by Kharcha Khata - '+BRAND.company+' - '+BRAND.webShort]);
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
async function exportCsv(){
  const R=reportData();if(!R.list.length)return toast('Nothing to export for this period');
  const csv=csvOf(R);const name=`kharcha-${R.scopeName.replace(/[^A-Za-z0-9]+/g,'-').toLowerCase()}-${fileStamp()}.csv`;
  const ok=await deliverFile(name,'text/csv',b64(csv));
  if(!ok){const sh=openLayer(`<div class="row between"><h3>CSV ready</h3><button class="icon-btn" data-x="close" aria-label="Close">${I.x}</button></div><p class="small muted" style="margin:0">If the download didn't start, copy this and paste it into Excel or Google Sheets.</p><pre class="csv" id="csvText">${esc(csv.slice(1))}</pre><button class="btn" data-x="copy">Copy CSV</button>`);
    sh.querySelector('[data-x=close]').onclick=closeLayer;
    sh.querySelector('[data-x=copy]').onclick=async()=>{try{await navigator.clipboard.writeText(csv.slice(1));toast('Copied')}catch(e){const r=document.createRange();r.selectNodeContents(sh.querySelector('#csvText'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Long-press to copy')}}}
}

  [/water|pani|पानी|पाणी/,'home',{home:'Water',daily:'Food & Chai',trip:'Food'}],
  [/petrol|diesel|fuel|cng|toll|पेट्रोल|डीजल|टोल/,'daily',{daily:'Petrol',trip:'Fuel & Toll'}],
  [/ticket|train|flight|railway|irctc|टिकट|तिकीट|ट्रेन/,'daily',{daily:'Auto / Bus',trip:'Tickets'}],
  [/auto|rickshaw|riksha|bus|metro|uber|ola|rapido|cab|taxi|scooty|ऑटो|रिक्शा|रिक्षा|बस/,'daily',{daily:'Auto / Bus',trip:'Local Travel'}],
  [/hotel|room|stay|resort|lodge|homestay|villa|हॉटेल|होटल/,'trip',{trip:'Hotel / Stay',daily:'Food & Chai',home:'Other'}],
  [/sightseeing|entry|museum|fort|boating|jeep|safari|parasailing|darshan|दर्शन/,'trip',{trip:'Sightseeing',daily:'Movies & Fun'}],
  [/recharge|mobile|jio|airtel|data pack|रिचार्ज/,'daily',{daily:'Recharge',home:'Internet / DTH'}],
  [/movie|cinema|film|match|party|outing|game|पिक्चर|सिनेमा/,'daily',{daily:'Movies & Fun',trip:'Sightseeing'}],
  [/shopping|clothes|kapde|shirt|shoes|saree|dress|souvenir|gift|कपडे|कपड़े|साडी|शॉपिंग/,'daily',{daily:'Shopping',trip:'Shopping'}],
  [/chai|tea|coffee|nashta|breakfast|lunch|dinner|food|khana|snack|vada|pav|biryani|pizza|swiggy|zomato|thali|meal|चाय|चहा|नाश्ता|जेवण|खाना|भोजन/,'daily',{daily:'Food & Chai',trip:'Food',home:'Kirana'}]
];
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function wordsToDigits(t){
  return t.replace(/\b(?:(?:zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|lakh|lac)\b[\s-]*(?:and\s+(?=(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\b))?)+/g,m=>{
    let total=0,cur=0,any=false;m.toLowerCase().split(/[\s-]+/).forEach(w=>{if(w in NUMW){cur+=NUMW[w];any=true}else if(w==='hundred'){cur=(cur||1)*100;any=true}else if(w==='thousand'){total+=(cur||1)*1000;cur=0;any=true}else if(w==='lakh'||w==='lac'){total+=(cur||1)*100000;cur=0;any=true}});
    return any?' '+(total+cur)+' ':m});
}
function normVoice(t){
  t=String(t||'').replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d)).toLowerCase();
  t=t.replace(/(\d),(\d)/g,'$1$2').replace(/₹\s*/g,' ').replace(/\b(rs\.?|rupees?|rupaye|rupay|inr)\b|रुपये|रुपए|रुपया|रुपयांचे|रु\./g,' ');
  return wordsToDigits(t).replace(/\s+/g,' ').trim();
}
const NUMRE=/(\d+(?:\.\d+)?)\s*(k\b|thousand\b|hazar\b|hajar\b|हजार|lakh\b|lac\b|लाख)?/;
const hasNum=s=>NUMRE.test(s);
function parseVoice(raw){
  const t=normVoice(raw);if(!t)return [];
  // global date words
  const dateOf=s=>/day before yesterday|parso|परसों|परवा/.test(s)?addDays(today(),-2):/yesterday|\bkal\b|कल|काल/.test(s)?addDays(today(),-1):null;
  let segs=t.split(/\s*(?:,|;|\band\b|\baur\b|\bani\b|\bplus\b|और|आणि|अन)\s*/).filter(Boolean);
  const merged=[];segs.forEach(sg=>{if(hasNum(sg)||!merged.length)merged.push(sg);else merged[merged.length-1]+=' '+sg});
  if(merged.length>1&&!hasNum(merged[0])){merged[1]=merged[0]+' '+merged[1];merged.shift()}
  const ctxTrip=ui.tab==='trip'?book(ui.tripId):null;
  const activeTrip=on('trips')?trips().filter(b=>tripStatus(b)==='active')[0]:null;
  const lead=dateOf(merged[0])||today();
  return merged.map(sg=>{
    const mm=sg.match(NUMRE);if(!mm)return null;
    let amt=parseFloat(mm[1]);const mul=mm[2]||'';if(/k|thousand|hazar|hajar|हजार/.test(mul))amt*=1000;if(/lakh|lac|लाख/.test(mul))amt*=100000;
    amt=r2(amt);if(!(amt>0))return null;
    let rest=(' '+sg.replace(mm[0],' ')+' ');
    // book
    let bk=null;
    for(const tr of (on('trips')?trips():[])){const n=tr.name.toLowerCase().replace(/\s*trip$/,'');if(n&&rest.includes(n)){bk=tr;rest=rest.replace(tr.name.toLowerCase(),' ').replace(n,' ');break}}
    if(!bk&&/\b(home|ghar|house|household)\b|घर/.test(rest)){bk=book('home');rest=rest.replace(/\b(for |in |to )?(home|ghar|house|household)\b|घर/g,' ')}
    if(!bk&&/\b(daily|personal)\b/.test(rest)){bk=book('daily');rest=rest.replace(/\b(in |to )?(daily|personal)\b/g,' ')}
    if(!bk&&/\btrip\b/.test(rest)){bk=ctxTrip||activeTrip||null;rest=rest.replace(/\b(for |in |on )?(the )?trip\b/g,' ')}
    const key=VKEYS.find(k=>k[0].test(rest));
    if(!bk)bk=ctxTrip||(ui.tab==='home'?book('home'):null)||(key?(key[1]==='trip'?(activeTrip||book('daily')):book(key[1])):book('daily'));
    if((bk.type==='home'&&!on('home'))||(bk.type==='trip'&&!on('trips')))bk=book('daily');
    const names=CATS[bk.type].map(c=>c[0]);
    let cat=key&&key[2][bk.type];if(!cat||!names.includes(cat))cat='Other';
    // date
    const date=dateOf(sg)||lead;
    rest=rest.replace(/day before yesterday|yesterday|today|\bkal\b|\baaj\b|\bparso\b|परसों|कल|आज|काल|परवा/g,' ');
    // members
    let paidBy='me',split='equal',forMember='me';
    if(bk.members.length>1){
      for(const m of bk.members){const nm=memberName(bk,m.id).toLowerCase();if(!nm)continue;const esc_=nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        const paidRe=new RegExp('(?:paid by\\s+'+esc_+'\\b|\\b'+esc_+'\\s+(?:paid|ne|gave|diye|diya|ने|ने दिए|ने दिया|नी))');
        const forRe=new RegExp('(?:\\b(?:only\\s+)?for\\s+'+esc_+'\\b(?:\\s+only)?|\\bonly\\s+'+esc_+'\\b|\\b'+esc_+'(?:\\s+ka|\\s+ki|\\s+ke|\\s+ke liye|\\s+साठी|\\s+के लिए|\\s+का)\\b)');
        if(paidRe.test(rest)){paidBy=m.id;rest=rest.replace(paidRe,' ')}
        if(forRe.test(rest)){split='individual';forMember=m.id;rest=rest.replace(forRe,' ')}}
      if(/\b(i paid|paid by me|maine|मैंने|मी दिले)\b/.test(rest)){paidBy='me';rest=rest.replace(/\b(i paid|paid by me|maine)\b|मैंने|मी दिले/g,' ')}
      if(/\b(only me|for me|just me|mera|my own|मेरा|माझा)\b/.test(rest)&&split==='equal'){split='individual';forMember='me';rest=rest.replace(/\b(only me|for me|just me|mera|my own)\b|मेरा|माझा/g,' ')}
    }
    let note=rest.replace(/\b(spent|spend|paid|pay|add|added|kharcha|kharch|expense|for|on|of|in|the|a|an|ka|ki|ke|ko|me|mein|la|cha|chi|che|ला|चा|ची|चे|का|की|के|में|मध्ये|खर्च|दिए|दिले)\b/g,' ').replace(/[.?!]/g,' ').replace(/\s+/g,' ').trim();
    if(!/[a-zऀ-ॿ]/i.test(note))note='';
    note=note?note.charAt(0).toUpperCase()+note.slice(1):'';
    const item={bookId:bk.id,amount:amt,cat,date,note:note.slice(0,80),paidBy,split,forMember,among:bk.members.map(m=>m.id),shares:{},photoId:null};
    if(cat==='Other'&&note)item.otherText=note.split(' ').slice(0,3).join(' ');
    return item;
  }).filter(Boolean);
}
function itemRecord(it){
  const b=book(it.bookId);let shares;
  if(b.members.length<2)shares={[it.paidBy]:it.amount};
  else if(it.split==='individual')shares={[it.forMember]:it.amount};
  else shares=equalShares(it.amount,b.members.map(m=>m.id));
  const cat=it.cat==='Other'&&it.otherText?it.otherText.charAt(0).toUpperCase()+it.otherText.slice(1):it.cat;
  return {id:uid(),bookId:it.bookId,amount:it.amount,cat,date:it.date,note:it.note,paidBy:it.paidBy,split:it.split,among:b.members.map(m=>m.id),forMember:it.forMember,shares,photoId:null};
}
let V=null;
function openVoice(){
  V={items:[],listening:false,rec:null};
  const lang=S.settings.voiceLang||'en-IN';
  const sh=openLayer(`
    <div class="row between"><h3>Speak an expense</h3><button class="icon-btn" data-x="close" aria-label="Close">${I.x}</button></div>
    <div class="seg" id="vLang">${VLANGS.map(([k,l])=>`<button data-l="${k}" class="${lang===k?'on':''}">${l}</button>`).join('')}</div>
    <button class="mic-big" id="vMic" aria-label="Start speaking">${I.mic}</button>
    <p class="small muted" id="vState" style="margin:-6px 0 0;text-align:center">Tap the mic and say the amount and what it was for</p>
    <div class="hint">${['Petrol 500','Milk 60 and sabzi 200','Yesterday auto 80','Rahul paid 1200 for dinner','Rent 12000 for home'].map(h=>`<button data-h="${esc(h)}">${esc(h)}</button>`).join('')}</div>
    <label class="field"><span>What you said (you can correct it)</span><textarea class="inp" id="vText" rows="2" placeholder="e.g. chai 40 and auto 60"></textarea></label>
    <div id="vItems"></div>
    <button class="btn block" id="vSave" hidden>Save</button>`);
  const q=s=>sh.querySelector(s);
  const paint=()=>{
    const n=V.items.length;
    q('#vItems').innerHTML=n?`<div class="card" style="padding:4px 14px;box-shadow:none;border:1px solid var(--line)">${V.items.map((it,i)=>{const b=book(it.bookId);const cat=it.cat==='Other'&&it.otherText?it.otherText:it.cat;
      const who=b.members.length>1?(it.split==='individual'?' · for '+memberName(b,it.forMember):' · split all')+' · paid by '+memberName(b,it.paidBy):'';
      return `<div class="vitem"><span class="cat-badge" style="background:${catColor(b.type,it.cat)}">${catInitials(cat)}</span><span class="grow" style="min-width:0"><div style="font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.note||cat)} <span class="num">${fmt(it.amount)}</span></div>
      <div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.name)} · ${esc(cat)} · ${dayLabel(it.date)}${esc(who)}</div></span>
      <button class="act" data-ve="${i}">Edit</button><button class="rm" data-vr="${i}" aria-label="Remove">${I.x}</button></div>`}).join('')}</div>`
      :(q('#vText').value.trim()?`<p class="small" style="margin:0;color:var(--warn);font-weight:600">I couldn't find an amount. Say a number, like "petrol 500".</p>`:'');
    const btn=q('#vSave');btn.hidden=!n;btn.textContent=n===1?`Save ${fmt(V.items[0].amount)}`:`Save all ${n} · ${fmt(V.items.reduce((a,x)=>a+x.amount,0))}`;
  };
  const reparse=()=>{V.items=parseVoice(q('#vText').value);paint()};
  const setLive=(on,msg)=>{V.listening=on;q('#vMic').classList.toggle('live',on);q('#vState').textContent=msg||(on?'Listening…':'Tap the mic and say the amount and what it was for')};
  const addText=t=>{t=(t||'').trim();if(!t)return;const ta=q('#vText');ta.value=ta.value.trim()?ta.value.trim()+', '+t:t;reparse()};
  async function listen(){
    const L=S.settings.voiceLang||'en-IN';
    if(isNative()){
      const SR=plugin('SpeechRecognition');
      try{const a=await SR.available();if(!a.available){setLive(false,'Speech recognition is not available on this phone. Install or update the Google app.');return}
        let p=await SR.checkPermissions();if(p.speechRecognition!=='granted')p=await SR.requestPermissions();
        if(p.speechRecognition!=='granted'){setLive(false,'Microphone permission is off. Allow it in Settings › Apps › Kharcha Khata.');return}
        setLive(true);const r=await SR.start({language:L,maxResults:1,prompt:'Say your expense',partialResults:false,popup:true});
        setLive(false);addText(r&&r.matches&&r.matches[0]);
      }catch(e){setLive(false,/no match|didn't|cancel/i.test(String(e&&e.message||e))?'Didn\'t catch that. Tap the mic and try again.':'Voice error: '+(e.message||e))}
      return;
    }
    const W=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!W){setLive(false,'Voice works in the installed app. Here, type what you would say.');q('#vText').focus();return}
    if(V.listening&&V.rec){V.rec.stop();return}
    try{const rec=new W();V.rec=rec;rec.lang=L;rec.interimResults=false;rec.maxAlternatives=1;
      rec.onresult=ev=>addText(ev.results[0][0].transcript);
      rec.onerror=ev=>setLive(false,ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Microphone is blocked here. Type what you would say instead.':ev.error==='no-speech'?'Didn\'t hear anything. Tap the mic and try again.':'Voice error: '+ev.error);
      rec.onend=()=>{if(V.listening)setLive(false)};
      setLive(true);rec.start();
    }catch(e){setLive(false,'Voice works in the installed app. Here, type what you would say.')}
  }
  sh.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;
    if(t.dataset.x==='close'){if(V.rec)try{V.rec.abort()}catch(e){};closeLayer();return}
    if(t.id==='vMic')return listen();
    if(t.dataset.l){S.settings.voiceLang=t.dataset.l;save();sh.querySelectorAll('#vLang button').forEach(b=>b.classList.toggle('on',b===t));return}
    if(t.dataset.h!=null){q('#vText').value=t.dataset.h;reparse();return}
    if(t.dataset.vr!=null){V.items.splice(+t.dataset.vr,1);paint();return}
    if(t.dataset.ve!=null){const i=+t.dataset.ve;const it=V.items[i];
      openExpense({prefill:it,onSaved:()=>{V.items.splice(V.items.indexOf(it),1);paint();if(!V.items.length){closeLayer()}}});return}
    if(t.id==='vSave'){const recs=V.items.map(itemRecord);recs.forEach(r=>S.expenses.push(r));save();closeLayer();render();
      const crossed=[...new Set(recs.map(r=>r.bookId))].map(book).find(b=>{if(!on('budgets')||!b.budget)return false;const sp=b.type==='trip'?sum(realEx(exOf(b.id))):sum(realEx(exOf(b.id)).filter(x=>monthOf(x.date)===thisMonth()));return sp>=b.budget});
      toast((recs.length===1?'Expense saved':recs.length+' expenses saved')+(crossed?` · ${crossed.name} budget crossed!`:''),3000)}
  });
  q('#vText').addEventListener('input',reparse);
}
$('#micFab').addEventListener('click',openVoice);

/* Android back button */
function handleBack(){
  if(layerStack.length){closeLayer();return true}
  if(ui.locked)return false;
  if(ui.tab==='setup')return false;
  if(ui.tab==='trip'){ui.tab='trips';render();return true}
  if(ui.tab==='recurring'&&ui.prevTab==='settings'){ui.tab='settings';ui.prevTab=null;render();return true}
  if(ui.tab!=='overview'){ui.tab='overview';render();return true}
  return false;
}

/* ============ boot ============ */
(async function boot(){
  await DB.open();
  S=await DB.get('kv','state');
  if(!S||!S.books){S=freshState()}
  S.income=S.income||[];S.udhaar=S.udhaar||[];S.recurring=S.recurring||[];S.people=S.people||{};S.settings=S.settings||{name:'Me'};
  if(!S.samplesShown){seedSamples();await DB.put('kv','state',S)}
  processRecurring();
  render();
  if(S.settings.lock)showLock();
  if(isNative()){
    const App=plugin('App');
    if(App){App.addListener('backButton',()=>{if(!handleBack())App.exitApp()});
      App.addListener('appStateChange',({isActive})=>{if(!isActive){ui.hiddenAt=Date.now();DB.put('kv','state',S)}else onResume()})}
    syncNotifs();
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){ui.hiddenAt=Date.now();DB.put('kv','state',S)}else onResume()});
})();
</script>
